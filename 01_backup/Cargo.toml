[package]
name = "vci_backup"
version = "1.0.0"
edition = "2024"
description = "VCI BIM Backup Tool - Dong bo du lieu tu \\\\Vci-bim-nas sang o cung Elements"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "=0.29.1"
filetime = "0.2.29"
num_cpus = "1.17.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
walkdir = "2.5.0"

# Build toi uu cho ban release: giam RAM/dung luong, tang toc do khoi dong
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
incremental = false
