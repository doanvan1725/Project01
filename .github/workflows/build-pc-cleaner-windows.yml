name: Build PC Cleaner Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: 03_pc_cleaner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon=pc_cleaner.ico --name PCCleaner main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Cleaner-windows
          path: 03_pc_cleaner/dist/PCCleaner.exe
